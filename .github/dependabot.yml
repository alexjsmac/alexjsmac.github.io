# Dependabot opens update PRs itself; ci.yml checks them like any other PR.
# This layout is shared across alexjsmac's site repos (only the framework
# group differs) so the weekly Dependabot review can treat them all the same.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Hold back releases younger than this. A merge auto-deploys to Pages, and
    # hijacked npm releases are usually caught and yanked within days.
    # Security updates ignore cooldown, so advisories still land immediately.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # TypeScript 7 is the Go rewrite and drops the JS compiler API that
    # typescript-eslint is built on. Remove this once typescript-eslint supports 7;
    # until then every 7.x PR fails npm ci.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      # three.js and its React bindings are version-coupled: bumping one
      # without the others breaks the scene, so they ship as one PR.
      three:
        patterns:
          - three
          - '@types/three'
          - '@react-three/*'
      # react and react-dom must be the exact same version or the page throws
      # React error #527 and renders nothing, which CI can't see (it never
      # renders the page). Ahead of dev-tooling so the @types ride along:
      # Dependabot puts each dependency in the first group it matches.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      # Font packages are versioned in lockstep upstream and are content, not code.
      fontsource:
        patterns:
          - '@fontsource/*'
          - '@fontsource-variable/*'
      # Build, lint and test tooling: batch the safe bumps. Majors stay
      # individual so each one gets read.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'
