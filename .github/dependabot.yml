version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # three.js and its React bindings are version-coupled — bumping one
      # without the others breaks the scene, so they ship as a single PR.
      three:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
      # Build and lint tooling is noisy and low-risk; batch the safe bumps.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Actions pinned by the Pages deploy workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
